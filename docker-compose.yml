services:
  web:
    container_name: asana-web
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Local dev: 127.0.0.1:3005; production nginx reaches via 0.0.0.0 (bridge gateway 172.18.0.1 also works)
      # Changed from 172.18.0.1:3005 to 0.0.0.0:3005 so `docker compose up` works on fresh laptops
      # where 172.18.0.1 does not exist. Production firewall should still restrict 3005 if needed.
      - "3005:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: 512m
    mem_reservation: 256m
    pids_limit: 128
    volumes:
      - uploads_data:/app/public/uploads
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  db:
    container_name: asana-db
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 256m
    mem_reservation: 128m
    pids_limit: 128
    shm_size: 64m
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres_data:
    name: asana_postgres_data
  uploads_data:
    name: asana_uploads
